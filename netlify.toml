# The React (Vite) storefront lives in /frontend; the Spring Boot backend in
# /backend is not deployed by Netlify.
[build]
  base = "frontend"
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app fallback so client-side routes (e.g. /shop, /admin) work on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
