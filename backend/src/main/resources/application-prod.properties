# Production Profile
server.port=${PORT:10000}
server.address=0.0.0.0

# Startup Optimization for Render Free Tier
spring.main.lazy-initialization=true
spring.jpa.open-in-view=false

# Permanent PostgreSQL Connection (binds to Render / Neon PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL}}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP Connection Pool (optimized for 512MB RAM)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA & DDL Configuration (Enforce update mode & never run sql scripts)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Brevo HTTPS REST API (for transactional emails over Port 443 HTTPS on Render)
app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.sender-email=${MAIL_USERNAME:vibeseekers09@gmail.com}
app.brevo.sender-name=Vibe Seekers

# Spring Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:vibeseekers09@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Security & JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=86400000
app.jwt.refresh-token-expiration-ms=604800000

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://vibeseekers.in,https://www.vibeseekers.in}

# Admin Seed Account
app.admin.email=${ADMIN_EMAIL:vibeseekers09@gmail.com}
app.admin.password=${ADMIN_PASSWORD:Admin@Vibe2026!}
app.admin.name=Vivek Ashok Matne

# Shiprocket
app.shiprocket.base-url=https://apiv2.shiprocket.in/v1/external
app.shiprocket.email=${SHIPROCKET_EMAIL:vivekmatne@gmail.com}
app.shiprocket.password=${SHIPROCKET_PASSWORD}
app.shiprocket.webhook-token=${SHIPROCKET_WEBHOOK_TOKEN}

# Cloudinary
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.media.upload-dir=/var/data/uploads
