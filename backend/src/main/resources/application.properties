spring.application.name=vibe-seekers-backend

# Active profile: dev by default; prod in Docker/Render/Railway/AWS
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Port (dynamic for cloud platforms like Render / Heroku / Railway)
server.port=${PORT:8080}

# File Upload limits (up to 15MB total, 5MB per file for images/screenshots)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# Jackson JSON formatting
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ
spring.jackson.time-zone=Asia/Kolkata

# Brevo Transactional Email REST API (Port 443 HTTPS for cloud platforms like Render)
app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.sender-email=${MAIL_USERNAME:vibeseekers09@gmail.com}
app.brevo.sender-name=Vibe Seekers

# Cloudinary (Media Storage for product images and uploads)
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

