name: Deploy Vibe Seekers Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build React frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://vibeseekers-api.onrender.com
          VITE_API_BASE_URL: https://vibeseekers-api.onrender.com
        run: npm run build

      - name: Prepare GitHub Pages SPA routing
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
