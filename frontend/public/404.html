<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VIBE SEEKERS | Loading...</title>
    <script type="text/javascript">
      // GitHub Pages SPA client-side router redirect
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background:#080808;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p style="letter-spacing:0.2em;text-transform:uppercase;font-size:12px;">Redirecting to VIBE SEEKERS...</p>
  </body>
</html>
